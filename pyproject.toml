[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fridge-backend"
version = "0.1.0"
description = "Inventory and meal-prep backend for Fridge, Hermes, and GlucoTracker."
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
fridge-import-gmail = "fridge_api.cli.import_gmail:main"
fridge-enrichment-worker = "fridge_api.cli.enrichment_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
